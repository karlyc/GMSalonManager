<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salon Manager</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#F6F1F2;
    --surface:#FFFFFF;
    --surface-alt:#FBF7F8;
    --primary:#7D4F5C;
    --primary-dark:#5E3945;
    --primary-light:#F1E4E7;
    --accent:#C9A876;
    --text:#2B2129;
    --text-muted:#8A7A80;
    --success:#5F8566;
    --success-light:#E7EFE7;
    --danger:#B5544A;
    --danger-light:#F6E7E5;
    --border:#E9DFE2;
    --radius:10px;
    --shadow:0 1px 2px rgba(43,33,41,0.06), 0 4px 16px rgba(43,33,41,0.04);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);}
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  .app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{width:220px;background:var(--primary-dark);color:#fff;display:flex;flex-direction:column;padding:24px 0;flex-shrink:0;}
  .brand{padding:0 24px 24px;border-bottom:1px solid rgba(255,255,255,0.12);margin-bottom:16px;}
  .brand h1{font-size:20px;color:#fff;letter-spacing:0.3px;}
  .brand span{display:block;font-size:12px;color:var(--accent);margin-top:2px;letter-spacing:1.5px;text-transform:uppercase;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:12px 24px;color:rgba(255,255,255,0.75);text-decoration:none;font-size:14px;font-weight:500;border-left:3px solid transparent;transition:all .15s;}
  .nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,0.1);color:#fff;border-left-color:var(--accent);}
  .nav-item .ic{font-size:16px;width:18px;text-align:center;}
  .sidebar-footer{margin-top:auto;padding:16px 24px 0;}
  .settings-btn{width:100%;text-align:left;background:transparent;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.75);padding:10px 12px;border-radius:8px;font-size:13px;}
  .settings-btn:hover{background:rgba(255,255,255,0.08);color:#fff;}

  /* Main */
  .main{flex:1;padding:32px 40px;overflow-y:auto;}
  .page-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;}
  .page-header h2{font-size:26px;}
  .page-header .sub{color:var(--text-muted);font-size:14px;margin-top:4px;}

  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--primary);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;transition:background .15s;}
  .btn:hover{background:var(--primary-dark);}
  .btn.secondary{background:var(--surface);color:var(--primary);border:1px solid var(--border);}
  .btn.secondary:hover{background:var(--primary-light);}
  .btn.danger{background:var(--danger);}
  .btn.danger:hover{background:#973f37;}
  .btn.sm{padding:6px 12px;font-size:13px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .grid{display:grid;gap:16px;}
  .cards-3{grid-template-columns:repeat(3,1fr);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
  .stat-card .label{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);font-weight:600;}
  .stat-card .value{font-family:'Fraunces',serif;font-size:32px;margin-top:6px;color:var(--primary-dark);}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);padding:10px 12px;border-bottom:1px solid var(--border);}
  td{padding:12px;border-bottom:1px solid var(--border);font-size:14px;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--surface-alt);}
  tfoot td{border-top:2px solid var(--border);border-bottom:none;background:var(--surface-alt);}

  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;}
  .badge.scheduled{background:var(--primary-light);color:var(--primary-dark);}
  .badge.completed{background:var(--success-light);color:var(--success);}
  .badge.cancelled{background:var(--danger-light);color:var(--danger);}
  .badge.overdue{background:var(--danger-light);color:var(--danger);}
  .badge.partial{background:#F8EFD9;color:#8A6A1F;}
  .badge.upcoming{background:var(--primary-light);color:var(--primary-dark);}
  .badge.paid{background:var(--success-light);color:var(--success);}

  .empty{text-align:center;padding:48px 20px;color:var(--text-muted);}
  .empty .big{font-size:32px;margin-bottom:8px;}

  input[type=text],input[type=tel],input[type=email],input[type=date],input[type=time],input[type=month],input[type=number],select,textarea{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff;color:var(--text);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:1px;}
  label{font-size:13px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:6px;}
  .field{margin-bottom:14px;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(43,33,41,0.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.25);}
  .modal.wide{max-width:640px;}
  .modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .modal-header h3{font-size:19px;}
  .modal-close{background:none;border:none;font-size:20px;color:var(--text-muted);line-height:1;}
  .modal-body{padding:24px;}
  .modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}

  .search-bar{margin-bottom:20px;}
  .toolbar{display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap;}
  .toolbar input[type=date]{width:auto;}

  .client-list{display:flex;flex-direction:column;gap:8px;}
  .client-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:border-color .15s;}
  .client-row:hover{border-color:var(--primary);}
  .client-row .name{font-weight:600;}
  .client-row .meta{font-size:13px;color:var(--text-muted);margin-top:2px;}

  .service-pick{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;}
  .service-pick:hover{border-color:var(--primary);}
  .service-pick.selected{border-color:var(--primary);background:var(--primary-light);}
  .service-pick .name{font-weight:500;}
  .service-pick .price{font-weight:600;color:var(--primary-dark);}

  .checkout-layout{display:grid;grid-template-columns:1fr 340px;gap:24px;}
  .cart{position:sticky;top:32px;}
  .cart-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .cart-item button{background:none;border:none;color:var(--danger);font-size:13px;}
  .cart-total-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;}
  .cart-total-row.grand{font-size:20px;font-weight:700;font-family:'Fraunces',serif;color:var(--primary-dark);padding-top:12px;margin-top:6px;border-top:1px solid var(--border);}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--success);color:#fff;padding:14px 20px;border-radius:10px;box-shadow:var(--shadow);font-size:14px;font-weight:600;z-index:200;animation:slideIn .2s ease;}
  @keyframes slideIn{from{transform:translateY(10px);opacity:0;}to{transform:translateY(0);opacity:1;}}

  .history-item{padding:12px 0;border-bottom:1px solid var(--border);}
  .history-item:last-child{border-bottom:none;}
  .history-item .top{display:flex;justify-content:space-between;font-size:13px;color:var(--text-muted);}
  .icon-btn{background:none;border:none;color:var(--text-muted);font-size:15px;padding:4px 8px;}
  .icon-btn:hover{color:var(--primary);}
  .small-muted{font-size:12px;color:var(--text-muted);}
  .link-btn{background:none;border:none;color:var(--primary);font-size:12px;font-weight:600;padding:0;text-decoration:underline;}

  .admin-section{margin-bottom:28px;}
  .admin-section h3{font-size:15px;margin-bottom:14px;}
  .payment-row, .service-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .payment-row input, .service-row input{margin-bottom:0;}

  .quick-add-box{border:1px dashed var(--border);border-radius:8px;padding:12px;margin-top:10px;}
  .quick-add-box .field-row{align-items:flex-end;}

  /* Receipt */
  .receipt{font-family:'Inter',monospace;font-size:13px;color:#111;}
  .receipt h2{font-size:18px;text-align:center;}
  .receipt .center{text-align:center;}
  .receipt .divider{border-top:1px dashed #999;margin:12px 0;}
  .receipt table{width:100%;font-size:13px;}
  .receipt td{padding:4px 0;border:none;font-size:13px;}
  .receipt .rt{text-align:right;}
  .receipt .totals-row{display:flex;justify-content:space-between;padding:2px 0;font-size:13px;}
  .receipt .grand-total{display:flex;justify-content:space-between;font-weight:700;font-size:16px;padding-top:8px;margin-top:6px;border-top:1px dashed #999;}

  @media print{
    body *{visibility:hidden;}
    #receiptPrintArea, #receiptPrintArea *{visibility:visible;}
    #receiptPrintArea{position:absolute;top:0;left:0;width:100%;padding:20px;}
    .modal-footer, .modal-close{display:none;}
  }
</style>
</head>
<body>
<div id="loginScreen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);">
  <div class="card" style="width:100%;max-width:360px;">
    <h2 style="margin-bottom:4px;">Salon Manager</h2>
    <p class="small-muted" style="margin-bottom:20px;">Sign in to access your data</p>
    <div class="field"><label>Email</label><input type="email" id="loginEmail"></div>
    <div class="field"><label>Password</label><input type="password" id="loginPassword"></div>
    <div id="loginError" style="color:var(--danger);font-size:13px;margin-bottom:12px;"></div>
    <button class="btn" id="loginBtn" style="width:100%;justify-content:center;">Sign In</button>
  </div>
</div>
<div id="reconnectBanner" style="display:none;background:var(--accent);color:#2B2129;padding:10px 20px;text-align:center;font-size:14px;font-weight:600;">
  This browser needs permission to keep saving to your linked data file.
  <button id="reconnectBtn" class="btn sm" style="margin-left:10px;">Reconnect</button>
</div>
<div class="app" style="display:none;">
  <div class="sidebar">
    <div class="brand">
      <h1 id="salonNameDisplay">My Salon</h1>
      <span>Local Manager</span>
    </div>
    <a class="nav-item" data-page="dashboard"><span class="ic">&#9679;</span> Dashboard</a>
    <a class="nav-item" data-page="appointments"><span class="ic">&#128197;</span> Appointments</a>
    <a class="nav-item" data-page="clients"><span class="ic">&#128100;</span> Clients</a>
    <a class="nav-item" data-page="checkout"><span class="ic">&#128176;</span> Checkout</a>
    <a class="nav-item" data-page="orders"><span class="ic">&#128203;</span> Orders</a>
    <a class="nav-item" data-page="expenses"><span class="ic">&#128179;</span> Expenses</a>
    <a class="nav-item" data-page="suites"><span class="ic">&#127970;</span> Suites</a>
    <a class="nav-item" data-page="reports"><span class="ic">&#128202;</span> Reports</a>
    <a class="nav-item" data-page="admin"><span class="ic">&#9881;</span> Admin</a>
    <div class="sidebar-footer">
      <button class="settings-btn" id="signOutBtn">Sign Out</button>
    </div>
  </div>
  <div class="main" id="main"></div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC6sR0qfpJ_0Z6ftYR4FpnIPqOVMi26dwU",
  authDomain: "mgsalon-3fae9.firebaseapp.com",
  projectId: "mgsalon-3fae9",
  storageBucket: "mgsalon-3fae9.firebasestorage.app",
  messagingSenderId: "721911730715",
  appId: "1:721911730715:web:b483241123ca55624b1ebe",
  measurementId: "G-69NYP95KWZ"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

let currentUser = null;
let unsubscribeSnapshot = null;
let firestoreLoaded = false;

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try{
    await signInWithEmailAndPassword(auth, email, password);
  }catch(err){
    errEl.textContent = 'Could not sign in. Check your email and password.';
  }
}
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('signOutBtn').addEventListener('click', ()=>signOut(auth));

async function connectFirestore(uid){
  const ref = doc(db, 'salonData', uid);
  const snap = await getDoc(ref);
  if(snap.exists()){
    DATA = snap.data();
  } else {
    // first login: seed the cloud with whatever is currently in this browser (or defaults)
    await setDoc(ref, DATA);
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
  firestoreLoaded = true;
  unsubscribeSnapshot = onSnapshot(ref, (docSnap)=>{
    if(docSnap.exists()){
      DATA = docSnap.data();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
      render();
    }
  });
}

async function pushToFirestore(){
  if(!currentUser) return;
  try{
    await setDoc(doc(db, 'salonData', currentUser.uid), DATA);
  }catch(err){
    console.error('Cloud sync failed', err);
    toast('Could not sync to the cloud (saved locally)');
  }
}

onAuthStateChanged(auth, async (user)=>{
  if(user){
    currentUser = user;
    document.getElementById('loginScreen').style.display = 'none';
    document.querySelector('.app').style.display = 'flex';
    await connectFirestore(user.uid);
    navigate('dashboard');
    tryAutoReconnect();
  } else {
    currentUser = null;
    firestoreLoaded = false;
    if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
    document.getElementById('loginScreen').style.display = 'flex';
    document.querySelector('.app').style.display = 'none';
  }
});

/* ---------------- Data Layer ---------------- */
const STORAGE_KEY = 'salonManagerData';

function loadData(){
  let raw = localStorage.getItem(STORAGE_KEY);
  let data;
  if(!raw){
    data = {
      clients: [],
      services: [
        {id: uid(), name:'Haircut', price:45},
        {id: uid(), name:'Color', price:95},
        {id: uid(), name:'Blowout', price:35},
        {id: uid(), name:'Highlights', price:120},
        {id: uid(), name:'Beard Trim', price:20},
      ],
      appointments: [],
      sales: [],
      expenses: [],
      subtenants: [],
      suitePayments: [],
      nextSuiteReceiptNumber: 1,
      nextReceiptNumber: 1,
      business: { name:'My Salon', address:'', phone:'', email:'', taxRate: 0, receiptNote:'Thank you for visiting!' },
      paymentMethods: [ {id:uid(), name:'Cash', feePercent:0}, {id:uid(), name:'Credit Card', feePercent:2.9} ]
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return data;
  }
  data = JSON.parse(raw);
  // migrate older data shape if needed
  let changed = false;
  if(!data.business){ data.business = { name: data.salonName || 'My Salon', address:'', phone:'', email:'', taxRate:0, receiptNote:'Thank you for visiting!' }; changed = true; }
  if(!data.paymentMethods){ data.paymentMethods = [ {id:uid(), name:'Cash', feePercent:0}, {id:uid(), name:'Credit Card', feePercent:2.9} ]; changed = true; }
  data.paymentMethods.forEach(p=>{ if(p.feePercent===undefined){ p.feePercent = 0; changed = true; } });
  data.sales.forEach((s,idx)=>{ if(!s.receiptNumber){ s.receiptNumber = idx+1; changed = true; } });
  data.sales.forEach(s=>{ if(!s.status){ s.status = 'completed'; changed = true; } });
  data.sales.forEach(s=>{
    if(s.items){
      s.items.forEach(it=>{ if(it.exempt===undefined){ it.exempt = !!s.taxExempt; changed = true; } });
    }
  });
  data.sales.forEach(s=>{ if(s.tip===undefined){ s.tip = 0; changed = true; } });
  if(!data.expenses){ data.expenses = []; changed = true; }
  if(!data.subtenants){ data.subtenants = []; changed = true; }
  if(!data.suitePayments){ data.suitePayments = []; changed = true; }
  if(!data.nextSuiteReceiptNumber){
    data.nextSuiteReceiptNumber = data.suitePayments.reduce((max,p)=>Math.max(max,p.receiptNumber||0),0) + 1;
    changed = true;
  }
  if(!data.nextReceiptNumber){
    const maxExisting = data.sales.reduce((max,s)=>Math.max(max, s.receiptNumber||0), 0);
    data.nextReceiptNumber = maxExisting + 1;
    changed = true;
  }
  if(changed) localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  return data;
}
function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
  if(fileConnected) writeToFile();
  pushToFirestore();
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

let DATA = loadData();

/* ---------------- File System Access (optional real-file storage) ---------------- */
const FS_SUPPORTED = 'showSaveFilePicker' in window;
let fileHandle = null;
let fileConnected = false;
let pendingReconnect = false;

const IDB_NAME = 'salonManagerFS';
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('handles'); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('handles','readonly');
    const r = tx.objectStore('handles').get(key);
    r.onsuccess = ()=>resolve(r.result || null);
    r.onerror = ()=>reject(r.error);
  });
}
async function idbSet(key,val){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('handles','readwrite');
    tx.objectStore('handles').put(val,key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function idbDelete(key){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('handles','readwrite');
    tx.objectStore('handles').delete(key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}

async function writeToFile(){
  if(!fileHandle) return;
  try{
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(DATA,null,2));
    await writable.close();
  }catch(err){ console.error('Could not write to linked file', err); }
}

function mergeImportedData(imported){
  if(!imported.business) imported.business = { name:'My Salon', address:'', phone:'', email:'', taxRate:0, receiptNote:'' };
  if(!imported.paymentMethods) imported.paymentMethods = [{id:uid(),name:'Cash'}];
  if(!imported.expenses) imported.expenses = [];
  if(!imported.subtenants) imported.subtenants = [];
  if(!imported.suitePayments) imported.suitePayments = [];
  return imported;
}

async function connectNewFile(){
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: 'salon-data.json',
      types: [{description:'JSON File', accept:{'application/json':['.json']}}]
    });
    fileHandle = handle;
    fileConnected = true;
    await idbSet('dataFileHandle', handle);
    await writeToFile();
    render();
    toast('Now saving to ' + handle.name);
  }catch(err){ if(err.name!=='AbortError') toast('Could not create the file'); }
}

async function connectExistingFile(){
  try{
    const [handle] = await window.showOpenFilePicker({
      types: [{description:'JSON File', accept:{'application/json':['.json']}}]
    });
    const perm = await handle.requestPermission({mode:'readwrite'});
    if(perm!=='granted'){ toast('Permission was not granted'); return; }
    const file = await handle.getFile();
    const text = await file.text();
    let imported;
    try{ imported = JSON.parse(text); }catch(e){ toast('That file is not valid data'); return; }
    if(!imported.clients || !imported.services){ toast('That file is not a valid salon data file'); return; }
    imported = mergeImportedData(imported);
    DATA = imported;
    fileHandle = handle;
    fileConnected = true;
    await idbSet('dataFileHandle', handle);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
    pushToFirestore();
    render();
    toast('Connected to ' + handle.name);
  }catch(err){ if(err.name!=='AbortError') toast('Could not open the file'); }
}

async function disconnectFile(){
  fileHandle = null;
  fileConnected = false;
  await idbDelete('dataFileHandle');
  render();
  toast('Disconnected. Now saving to browser storage only.');
}

async function reconnectFile(){
  if(!fileHandle) return;
  try{
    const perm = await fileHandle.requestPermission({mode:'readwrite'});
    if(perm==='granted'){
      pendingReconnect = false;
      fileConnected = true;
      const file = await fileHandle.getFile();
      const text = await file.text();
      const imported = mergeImportedData(JSON.parse(text));
      DATA = imported;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
      pushToFirestore();
      document.getElementById('reconnectBanner').style.display = 'none';
      render();
      toast('Reconnected to ' + fileHandle.name);
    } else {
      toast('Permission was not granted');
    }
  }catch(err){ toast('Could not reconnect'); }
}

async function tryAutoReconnect(){
  if(!FS_SUPPORTED) return;
  try{
    const handle = await idbGet('dataFileHandle');
    if(!handle) return;
    fileHandle = handle;
    const perm = await handle.queryPermission({mode:'readwrite'});
    if(perm==='granted'){
      fileConnected = true;
      const file = await handle.getFile();
      const text = await file.text();
      DATA = mergeImportedData(JSON.parse(text));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
      pushToFirestore();
      render();
    } else {
      pendingReconnect = true;
      document.getElementById('reconnectBanner').style.display = 'block';
    }
  }catch(err){ /* handle may be stale; ignore */ }
}

/* ---------------- Helpers ---------------- */
function fmtMoney(n){ return '$' + Number(n).toFixed(2); }
function computeSaleTotals(items, discountPct, taxRatePct, tip){
  const subtotal = items.reduce((s,i)=>s+i.price,0);
  const discountAmt = subtotal * ((discountPct||0)/100);
  const taxableSubtotal = items.filter(i=>!i.exempt).reduce((s,i)=>s+i.price,0);
  const nonTaxableSubtotal = subtotal - taxableSubtotal;
  const taxableDiscountShare = subtotal>0 ? discountAmt * (taxableSubtotal/subtotal) : 0;
  const taxableAfterDiscount = Math.max(0, taxableSubtotal - taxableDiscountShare);
  const taxAmt = taxableAfterDiscount * ((taxRatePct||0)/100);
  const tipAmt = Number(tip)||0;
  const total = Math.max(0, subtotal - discountAmt) + taxAmt + tipAmt;
  return { subtotal, discountAmt, taxableSubtotal, nonTaxableSubtotal, taxAmt, tip: tipAmt, total };
}
function fmtDate(d){
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric', year:'numeric'});
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function clientName(id){ const c = DATA.clients.find(c=>c.id===id); return c ? c.name : 'Walk-in'; }
function serviceById(id){ return DATA.services.find(s=>s.id===id); }
function paymentMethodById(id){ return DATA.paymentMethods.find(p=>p.id===id); }
function toast(msg){
  const el = document.createElement('div');
  el.className='toast';
  el.textContent = msg;
  document.getElementById('toastRoot').appendChild(el);
  setTimeout(()=>el.remove(), 2400);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------------- Expenses ---------------- */
let expenseMonth = todayStr().slice(0,7);

function getExpenses(){
  if(!Array.isArray(DATA.expenses)) DATA.expenses = [];
  return DATA.expenses;
}
function shiftMonth(ym, delta){
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function fmtMonth(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString(undefined,{month:'long', year:'numeric'});
}
function expenseAppliesToMonth(e, ym){
  if(e.type==='monthly'){
    if(e.month > ym) return false;
    if(e.endedFrom && ym >= e.endedFrom) return false;
    return true;
  }
  return e.month === ym;
}
function expensesForMonth(ym){
  return getExpenses().filter(e=>expenseAppliesToMonth(e, ym));
}
function expenseTotalForMonth(ym){
  return expensesForMonth(ym).reduce((s,e)=>s+(Number(e.amount)||0),0);
}

      <div class="card stat-card"><div class="label">One-time</div><div class="value">${fmtMoney(oneTimeTotal)}</div></div>
    </div>

    <div class="card" style="margin-bottom:24px;">
      <h3 style="margin-bottom:4px;font-size:15px;">${escapeHtml(fmtMonth(expenseMonth))}</h3>
      <p class="small-muted" style="margin-bottom:14px;">Monthly expenses carry forward every month automatically until you stop them. One-time expenses only count in the month they were entered.</p>
      ${list.length===0 ? `<div class="empty"><div class="big">&#128179;</div>No expenses for this month.</div>` :
      `<table><thead><tr><th>Expense</th><th>Type</th><th>Amount</th><th>Notes</th><th></th></tr></thead><tbody>
        ${list.map(e=>`
          <tr>
            <td>${escapeHtml(e.name)}</td>

              <button class="icon-btn" data-action="edit-expense" data-id="${e.id}" title="Edit">&#9998;</button>

/* ---------------- Suites (subtenants & rent) ---------------- */
let openSubtenantId = null;

function getSubtenants(){
  if(!Array.isArray(DATA.subtenants)) DATA.subtenants = [];
  return DATA.subtenants;
}
function getSuitePayments(){
  if(!Array.isArray(DATA.suitePayments)) DATA.suitePayments = [];
  return DATA.suitePayments;
}
function subtenantById(id){ return getSubtenants().find(s=>s.id===id); }
function suitePaymentById(id){ return getSuitePayments().find(p=>p.id===id); }
function fmtSuiteReceipt(n){ return 'S-' + String(n).padStart(4,'0'); }
function freqLabel(f){ return f==='weekly' ? 'Weekly' : 'Monthly'; }
function toCents(n){ return Math.round((Number(n)||0)*100); }

function addMonthsClamped(dateStr, n){
  const [y,m,d] = dateStr.split('-').map(Number);
  const first = new Date(y, m-1+n, 1);
  const lastDay = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
  const day = Math.min(d, lastDay);
  return first.getFullYear()+'-'+String(first.getMonth()+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
}

// Every due date on or before `upTo`, plus `extraUpcoming` dates after it.
function dueDatesFor(sub, upTo, extraUpcoming){
  const dues = [];
  if(!sub.startDate) return dues;
  let upcomingLeft = extraUpcoming || 0;
  for(let i=0; i<2000; i++){
    const d = sub.frequency==='weekly' ? shiftDate(sub.startDate, i*7) : addMonthsClamped(sub.startDate, i);
    if(sub.endDate && d > sub.endDate) break;
    if(d <= upTo) dues.push(d);
    else if(upcomingLeft > 0){ dues.push(d); upcomingLeft--; }
    else break;
  }
  return dues;
}

function scheduleDescription(freq, startDate){
  if(!startDate) return '';
  const d = new Date(startDate+'T00:00:00');
  if(isNaN(d.getTime())) return '';
  if(freq==='weekly') return 'Due every ' + d.toLocaleDateString(undefined,{weekday:'long'});
  const day = d.getDate();
  return 'Due on day ' + day + ' of each month' + (day>28 ? ' (or the last day of shorter months)' : '');
}

// Payments are applied to the oldest due date first.
function suiteStatus(sub){
  const today = todayStr();
  const amountC = toCents(sub.amount);
  const payments = getSuitePayments().filter(p=>p.subtenantId===sub.id);
  const paidC = payments.reduce((s,p)=>s+toCents(p.amount),0);
  const dues = dueDatesFor(sub, today, 3);
  let remainingC = paidC;
  const schedule = dues.map(date=>{
    let status, paidAmtC;
    if(remainingC >= amountC){ status='paid'; paidAmtC = amountC; remainingC -= amountC; }
    else if(remainingC > 0){ status='partial'; paidAmtC = remainingC; remainingC = 0; }
    else { status = date <= today ? 'overdue' : 'upcoming'; paidAmtC = 0; }
    return { date, amount: amountC/100, paidAmt: paidAmtC/100, status };
  });
  const dueCount = dues.filter(d=>d<=today).length;
  const balanceC = dueCount*amountC - paidC;
  return {
    paid: paidC/100,
    expected: dueCount*amountC/100,
    owed: Math.max(0,balanceC)/100,
    credit: Math.max(0,-balanceC)/100,
    schedule,
    next: schedule.find(s=>s.status!=='paid') || null,
    payments
  };
}

// Balance as of a given receipt: dues up to its date minus payments up to and including it.
function balanceAtPayment(p){
  const sub = subtenantById(p.subtenantId);
  if(!sub) return null;
  const dueCount = dueDatesFor(sub, p.date, 0).length;
  const paidC = getSuitePayments()
    .filter(x=>x.subtenantId===p.subtenantId && (x.date < p.date || (x.date===p.date && (x.receiptNumber||0) <= (p.receiptNumber||0))))
    .reduce((s,x)=>s+toCents(x.amount),0);
  return (dueCount*toCents(sub.amount) - paidC)/100;
}

      Object.assign(existing, { name, spaceId, amount, frequency, startDate, endDate, notes });
    } else {
      const sub = { id:uid(), name, spaceId, amount, frequency, startDate, endDate, notes };
      getSubtenants().push(sub);
      openSubtenantId = sub.id;
    }
    saveData();
    closeModal();
    render();
    toast(isEdit?'Subtenant updated':'Subtenant added');
  });
}

function openSuitePaymentModal(subtenantId, existing){
  const subs = getSubtenants().slice().sort((a,b)=>a.name.localeCompare(b.name));
  if(subs.length===0){ toast('Add a subtenant first'); return; }
  const isEdit = !!existing;

  const p = existing || { subtenantId: initialSub, amount:'', date: todayStr(), paymentMethodId:'', notes:'' };
  const defaultAmount = ()=>{ const sub = subtenantById(document.getElementById('payTenant').value); return sub ? sub.amount : ''; };
  openModal(`
    <div class="modal">
      <div class="modal-header"><h3>${isEdit?'Edit Payment':'Record Payment'}</h3><button class="modal-close" data-close-modal>&#10005;</button></div>
      <div class="modal-body">
        <div class="field">

          <div class="field"><label>Date received *</label><input type="date" id="payDate" value="${p.date}"></div>
        </div>
        <div class="field">
          <label>Payment method</label>
          <select id="payMethod">
            <option value="">-- select --</option>
            ${DATA.paymentMethods.map(m=>`<option value="${m.id}" ${p.paymentMethodId===m.id?'selected':''}>${escapeHtml(m.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Notes</label><textarea id="payNotes" rows="2">${escapeHtml(p.notes||'')}</textarea></div>
      </div>
      <div class="modal-footer">
        <button class="btn secondary" data-close-modal>Cancel</button>
        <button class="btn" id="savePaymentBtn">${isEdit?'Save Changes':'Save & Create Receipt'}</button>
      </div>
    </div>
  `);
  const updateOwedHint = ()=>{
    const sub = subtenantById(document.getElementById('payTenant').value);
    const hint = document.getElementById('payOwedHint');
    if(!sub){ hint.textContent = ''; return; }
    const st = suiteStatus(sub);
    hint.textContent = st.owed>0 ? 'Currently owed: ' + fmtMoney(st.owed)
      : (st.credit>0 ? 'Paid ahead by ' + fmtMoney(st.credit) : 'Nothing owed right now');
  };
  updateOwedHint();
  if(!isEdit && p.subtenantId){ document.getElementById('payAmount').value = defaultAmount(); }
  document.getElementById('payTenant').addEventListener('change', ()=>{
    updateOwedHint();
    if(!isEdit) document.getElementById('payAmount').value = defaultAmount();
  });
  document.getElementById('savePaymentBtn').addEventListener('click', ()=>{
    const tenantId = document.getElementById('payTenant').value;
    const amountRaw = document.getElementById('payAmount').value;
    const amount = Number(amountRaw);
    const date = document.getElementById('payDate').value;
    const methodId = document.getElementById('payMethod').value;
    const notes = document.getElementById('payNotes').value.trim();
    if(!tenantId){ toast('Please select a subtenant'); return; }
    if(amountRaw==='' || isNaN(amount) || amount<=0){ toast('Please enter the amount received'); return; }
    if(!date){ toast('Please choose the date received'); return; }
    const method = DATA.paymentMethods.find(m=>m.id===methodId);
    const methodName = method ? method.name : '';
    if(isEdit){
      Object.assign(existing, { amount, date, paymentMethodId: methodId, paymentMethodName: methodName, notes });
      saveData();
      closeModal();
      render();
      toast('Payment updated');
      return;
    }
    const maxExisting = getSuitePayments().reduce((max,x)=>Math.max(max,x.receiptNumber||0),0);
    const receiptNumber = Math.max(DATA.nextSuiteReceiptNumber||1, maxExisting+1);
    DATA.nextSuiteReceiptNumber = receiptNumber + 1;
    const payment = { id:uid(), receiptNumber, subtenantId: tenantId, amount, date, paymentMethodId: methodId, paymentMethodName: methodName, notes };
    getSuitePayments().push(payment);
    saveData();
    closeModal();
    render();
    openSuiteReceiptModal(payment);
  });
}

/* ---------------- Reports ---------------- */
let reportFrom = '';
let reportTo = '';

function getFilteredSales(){
  return DATA.sales.filter(s=>{
    if(reportFrom && s.date < reportFrom) return false;
    if(reportTo && s.date > reportTo) return false;
    return true;
  }).sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));
}

function startOfWeek(d){
  const dt = new Date(d+'T00:00:00');
  const day = dt.getDay();
  dt.setDate(dt.getDate() - day);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function startOfMonth(d){
  const dt = new Date(d+'T00:00:00');
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-01';
}

function renderReports(){
  const sales = getFilteredSales();
  const activeSales = sales.filter(s=>s.status!=='cancelled');
  const totalSubtotal = activeSales.reduce((s,x)=>s+x.subtotal,0);
  const totalTax = activeSales.reduce((s,x)=>s+x.taxAmt,0);
  const totalTips = activeSales.reduce((s,x)=>s+(x.tip||0),0);
  const totalSales = activeSales.reduce((s,x)=>s+x.total,0);

  // Total tips for the current calendar year, independent of the date filter above
  const currentYear = new Date().getFullYear();
  const tipsThisYear = DATA.sales
    .filter(s=>s.status!=='cancelled' && new Date(s.date+'T00:00:00').getFullYear()===currentYear)
    .reduce((sum,s)=>sum+(s.tip||0),0);
  const tipsOverLimit = tipsThisYear > 25000;

  // group by payment method (active sales only)
  const groups = {};
  activeSales.forEach(s=>{
    const key = s.paymentMethodId || 'none';
    if(!groups[key]){
      const pm = paymentMethodById(s.paymentMethodId);
      groups[key] = { name: s.paymentMethodName || (pm?pm.name:'Unknown'), feePercent: pm ? pm.feePercent : 0, count:0, subtotal:0, tax:0, tip:0, total:0 };
    }
    groups[key].count++;
    groups[key].subtotal += s.subtotal;
    groups[key].tax += s.taxAmt;
    groups[key].tip += (s.tip||0);
    groups[key].total += s.total;
  });
  const groupRows = Object.values(groups).sort((a,b)=>b.total-a.total);
  const totalFees = groupRows.reduce((sum,g)=>sum + g.total*(g.feePercent/100), 0);

  return `
    <div class="page-header">
      <div><h2>Reports</h2><div class="sub">Sales ledger and totals</div></div>
      <button class="btn secondary" data-action="export-report-csv">Export CSV</button>
    </div>

    <div class="toolbar">
      <button class="btn secondary sm" data-action="report-all">All Time</button>
      <button class="btn secondary sm" data-action="report-today">Today</button>
      <button class="btn secondary sm" data-action="report-week">This Week</button>
      <button class="btn secondary sm" data-action="report-month">This Month</button>
      <span class="small-muted">From</span>
      <input type="date" id="reportFromInput" value="${reportFrom}">
      <span class="small-muted">To</span>
      <input type="date" id="reportToInput" value="${reportTo}">
    </div>

    <div class="grid cards-3" style="margin-bottom:16px;">
      <div class="card stat-card"><div class="label">Total Subtotal</div><div class="value">${fmtMoney(totalSubtotal)}</div></div>
      <div class="card stat-card"><div class="label">Total Sales Tax</div><div class="value">${fmtMoney(totalTax)}</div></div>
      <div class="card stat-card"><div class="label">Total Sales</div><div class="value">${fmtMoney(totalSales)}</div></div>
    </div>
    <div class="grid cards-3" style="margin-bottom:24px;">
      <div class="card stat-card">
        <div class="label">Total Tips (${currentYear})</div>
        <div class="value" style="${tipsOverLimit?'color:var(--danger);':''}">${fmtMoney(tipsThisYear)}</div>
        ${tipsOverLimit ? `<div class="small-muted" style="color:var(--danger);margin-top:2px;">Over $25,000 for the year</div>` : ''}
      </div>
    </div>

    <div class="card" style="margin-bottom:24px;">
      <h3 style="margin-bottom:4px;font-size:15px;">Sales Ledger</h3>
      <p class="small-muted" style="margin-bottom:14px;">Cancelled sales are kept for your records but excluded from totals below. Tips are not taxed and aren't part of service revenue.</p>
      ${sales.length===0 ? `<div class="empty"><div class="big">&#128202;</div>No sales in this date range.</div>` :
      `<table><thead><tr><th>Date</th><th>Receipt #</th><th>Client</th><th>Payment Method</th><th>Subtotal</th><th>Tax</th><th>Tips</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>
        ${sales.map(s=>`
          <tr style="${s.status==='cancelled'?'opacity:0.5;':''}">
            <td>${fmtDate(s.date)}</td>
            <td>#${s.receiptNumber}</td>
            <td>${escapeHtml(clientName(s.clientId))}</td>
            <td>${escapeHtml(s.paymentMethodName||'-')}</td>
            <td>${fmtMoney(s.subtotal)}</td>
            <td>${fmtMoney(s.taxAmt)}</td>
            <td>${fmtMoney(s.tip||0)}</td>
            <td>${fmtMoney(s.total)}</td>
            <td><span class="badge ${s.status==='cancelled'?'cancelled':'completed'}">${s.status}</span></td>
            <td style="text-align:right;white-space:nowrap;">
              <button class="icon-btn" data-action="view-receipt" data-id="${s.id}" title="View receipt">&#128196;</button>
              <button class="icon-btn" data-action="edit-sale" data-id="${s.id}" title="Edit">&#9998;</button>
              ${s.status==='cancelled'
                ? `<button class="icon-btn" data-action="restore-sale" data-id="${s.id}" title="Restore">&#8635;</button>`
                : `<button class="icon-btn" data-action="cancel-sale" data-id="${s.id}" title="Cancel">&#10005;</button>`}
              <button class="icon-btn" data-action="delete-sale" data-id="${s.id}" title="Delete permanently">&#128465;</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
      <tfoot>
        <tr style="font-weight:700;">
          <td colspan="4">Totals (excludes cancelled)</td>
          <td>${fmtMoney(totalSubtotal)}</td>
          <td>${fmtMoney(totalTax)}</td>
          <td>${fmtMoney(totalTips)}</td>
          <td>${fmtMoney(totalSales)}</td>
          <td colspan="2"></td>
        </tr>
      </tfoot>
      </table>`}
    </div>

    <div class="card">
      <h3 style="margin-bottom:4px;font-size:15px;">By Payment Method</h3>
      <p class="small-muted" style="margin-bottom:14px;">Fee % is what your processor charges you — set it in Admin. Shown here only, never on customer receipts.</p>
      ${groupRows.length===0 ? `<div class="empty">No sales in this date range.</div>` :
      `<table><thead><tr><th>Payment Method</th><th># Sales</th><th>Subtotal</th><th>Tax</th><th>Tips</th><th>Total</th><th>Fee %</th><th>Fee Amount</th><th>Net After Fee</th></tr></thead><tbody>
        ${groupRows.map(g=>{
          const feeAmt = g.total * (g.feePercent/100);
          const net = g.total - feeAmt;
          return `<tr>
            <td>${escapeHtml(g.name)}</td>
            <td>${g.count}</td>
            <td>${fmtMoney(g.subtotal)}</td>
            <td>${fmtMoney(g.tax)}</td>
            <td>${fmtMoney(g.tip)}</td>
            <td>${fmtMoney(g.total)}</td>
            <td>${g.feePercent}%</td>
            <td>${fmtMoney(feeAmt)}</td>
            <td>${fmtMoney(net)}</td>
          </tr>`;
        }).join('')}
      </tbody>
      <tfoot>
        <tr style="font-weight:700;">
          <td colspan="5">Totals</td>
          <td>${fmtMoney(totalSales)}</td>
          <td></td>
          <td>${fmtMoney(totalFees)}</td>
          <td>${fmtMoney(totalSales-totalFees)}</td>
        </tr>
      </tfoot>
      </table>`}
    </div>
  `;
}

function exportReportCsv(){
  const sales = getFilteredSales();
  const rows = [['Date','Receipt #','Client','Payment Method','Subtotal','Tax','Tips','Total','Status']];
  sales.forEach(s=>{
    rows.push([s.date, s.receiptNumber, clientName(s.clientId), s.paymentMethodName||'', s.subtotal.toFixed(2), s.taxAmt.toFixed(2), (s.tip||0).toFixed(2), s.total.toFixed(2), s.status]);
  });
  const csv = rows.map(r=>r.map(cell=>{
    const v = String(cell);
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'salon-report-' + todayStr() + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

  document.getElementById('esDate').addEventListener('change', e=>{ editSaleState.date = e.target.value; });
  document.getElementById('esTime').addEventListener('change', e=>{ editSaleState.time = e.target.value; });
  document.getElementById('esClient').addEventListener('change', e=>{ editSaleState.clientId = e.target.value; });
  document.getElementById('esDiscount').addEventListener('change', e=>{ editSaleState.discount = Number(e.target.value)||0; renderEditSaleModal(); });
  document.getElementById('esTaxRate').addEventListener('change', e=>{ editSaleState.taxRate = Number(e.target.value)||0; renderEditSaleModal(); });
  document.getElementById('esTip').addEventListener('change', e=>{ editSaleState.tip = Number(e.target.value)||0; renderEditSaleModal(); });
  document.getElementById('esPaymentMethod').addEventListener('change', e=>{ editSaleState.paymentMethodId = e.target.value; });
  document.querySelectorAll('.esItemName').forEach(inp=>inp.addEventListener('change', e=>{
    editSaleState.items[Number(e.currentTarget.dataset.idx)].name = e.target.value;
  }));
  document.querySelectorAll('.esItemPrice').forEach(inp=>inp.addEventListener('change', e=>{
    editSaleState.items[Number(e.currentTarget.dataset.idx)].price = Number(e.target.value)||0;
    renderEditSaleModal();
  }));
  document.querySelectorAll('.esItemTaxableChk').forEach(chk=>chk.addEventListener('change', e=>{
    editSaleState.items[Number(e.currentTarget.dataset.idx)].exempt = !e.target.checked;
    renderEditSaleModal();
  }));
  document.querySelectorAll('.esRemoveItem').forEach(btn=>btn.addEventListener('click', e=>{
    editSaleState.items.splice(Number(e.currentTarget.dataset.idx),1);
    renderEditSaleModal();
  }));
  document.getElementById('esAddServiceBtn').addEventListener('click', ()=>{
    const sel = document.getElementById('esAddServiceSelect');
    const sid = sel.value;
    if(!sid) return;
    const s = serviceById(sid);
    editSaleState.items.push({serviceId:sid, name:s.name, price:s.price, exempt:false});
    renderEditSaleModal();
  });
  document.getElementById('saveEditSaleBtn').addEventListener('click', saveEditedSale);

function saveEditedSale(){
  const sale = DATA.sales.find(s=>s.id===editSaleState.saleId);
  if(!sale) return;
  if(!editSaleState.clientId){ toast('Please select a client'); return; }
  if(editSaleState.items.length===0){ toast('A sale needs at least one item'); return; }
  const totals = computeSaleTotals(editSaleState.items, editSaleState.discount, editSaleState.taxRate, editSaleState.tip);
  const pm = paymentMethodById(editSaleState.paymentMethodId);
  Object.assign(sale, {
    clientId: editSaleState.clientId,
    date: editSaleState.date,
    time: editSaleState.time,
    items: editSaleState.items,
    discount: editSaleState.discount,
    subtotal: totals.subtotal, discountAmt: totals.discountAmt,
    taxRate: editSaleState.taxRate,
    taxableSubtotal: totals.taxableSubtotal, nonTaxableSubtotal: totals.nonTaxableSubtotal,
    taxAmt: totals.taxAmt, tip: totals.tip,
    total: totals.total,
    paymentMethodId: editSaleState.paymentMethodId,
    paymentMethodName: pm ? pm.name : ''
  });
  saveData();
  editSaleState = null;
  closeModal();
  render();
  toast('Sale updated');
}

    render();

    DATA.business.taxRate = Number(document.getElementById('bizTax').value)||0;

    });
    row.querySelector('.pmFee').addEventListener('change', e=>{
      const p = paymentMethodById(id); if(p){ p.feePercent = Number(e.target.value)||0; saveData(); }
    });
    row.querySelector('.removePmBtn').addEventListener('click', ()=>{
      DATA.paymentMethods = DATA.paymentMethods.filter(p=>p.id!==id);

      render();
    });
  });

  main.querySelectorAll('[data-service-id]').forEach(row=>{
    const id = row.dataset.serviceId;
    row.querySelector('.svcName').addEventListener('change', e=>{
      const s = serviceById(id); if(s){ s.name = e.target.value; saveData(); }
    });

      const s = serviceById(id); if(s){ s.price = Number(e.target.value)||0; saveData(); }

  const disconnectFileBtn = document.getElementById('disconnectFileBtn');
  if(disconnectFileBtn) disconnectFileBtn.addEventListener('click', disconnectFile);

  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'salon-backup-' + todayStr() + '.json';
    a.click();
    URL.revokeObjectURL(url);
  });

  const importFile = document.getElementById('importFile');
  if(importFile) importFile.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const imported = JSON.parse(ev.target.result);
        if(!imported.clients || !imported.services){ toast('Invalid backup file'); return; }
        if(!imported.business) imported.business = { name:'My Salon', address:'', phone:'', email:'', taxRate:0, receiptNote:'' };
        if(!imported.paymentMethods) imported.paymentMethods = [{id:uid(),name:'Cash'}];
        if(!imported.expenses) imported.expenses = [];
        if(!imported.subtenants) imported.subtenants = [];
        if(!imported.suitePayments) imported.suitePayments = [];
        if(confirm('This will replace all current data with the backup. Continue?')){
          DATA = imported;
          saveData();
          render();
          toast('Backup imported');
        }
      }catch(err){ toast('Could not read file'); }
    };
    reader.readAsText(file);
  });
}

function handleAction(action, id, el){
  if(action==='new-appt') return openAppointmentModal();
  if(action==='new-client') return openClientModal();
  if(action==='go-checkout') return navigate('checkout');
  if(action==='date-prev'){ apptFilterDate = shiftDate(apptFilterDate,-1); return render(); }
  if(action==='date-next'){ apptFilterDate = shiftDate(apptFilterDate,1); return render(); }
  if(action==='date-today'){ apptFilterDate = todayStr(); return render(); }
  if(action==='complete-appt'){ const a=DATA.appointments.find(a=>a.id===id); a.status='completed'; saveData(); render(); return toast('Appointment marked complete'); }
  if(action==='cancel-appt'){ const a=DATA.appointments.find(a=>a.id===id); a.status='cancelled'; saveData(); render(); return toast('Appointment cancelled'); }
  if(action==='delete-appt'){ if(confirm('Delete this appointment?')){ DATA.appointments = DATA.appointments.filter(a=>a.id!==id); saveData(); render(); } return; }
  if(action==='open-client'){ openClientId = id; return render(); }
  if(action==='back-clients'){ openClientId = null; return render(); }
  if(action==='edit-client'){ return openClientModal(DATA.clients.find(c=>c.id===id)); }
  if(action==='delete-client'){
    if(confirm('Delete this client and keep their history anonymized?')){
      DATA.clients = DATA.clients.filter(c=>c.id!==id);
      saveData(); openClientId=null; render(); toast('Client deleted');
    }
    return;
  }
  if(action==='toggle-service'){
    const s = serviceById(id);
    const idx = checkoutState.items.findIndex(i=>i.serviceId===id);
    if(idx>=0) checkoutState.items.splice(idx,1);
    else checkoutState.items.push({serviceId:id, name:s.name, price:s.price, exempt:false});
    return render();
  }
  if(action==='toggle-quick-add'){ showQuickAdd = !showQuickAdd; return render(); }
  if(action==='remove-item'){
    checkoutState.items.splice(Number(el.dataset.idx),1);
    return render();
  }
  if(action==='report-all'){ reportFrom=''; reportTo=''; return render(); }
  if(action==='report-today'){ reportFrom=todayStr(); reportTo=todayStr(); return render(); }
  if(action==='report-week'){ reportFrom=startOfWeek(todayStr()); reportTo=todayStr(); return render(); }
  if(action==='report-month'){ reportFrom=startOfMonth(todayStr()); reportTo=todayStr(); return render(); }
  if(action==='export-report-csv'){ exportReportCsv(); return; }
  if(action==='new-subtenant'){ openSubtenantModal(); return; }
  if(action==='edit-subtenant'){ openSubtenantModal(subtenantById(id)); return; }
  if(action==='open-subtenant'){ openSubtenantId = id; return render(); }
  if(action==='back-suites'){ openSubtenantId = null; return render(); }
  if(action==='delete-subtenant'){
    const sub = subtenantById(id);
    if(!sub) return;
    const count = getSuitePayments().filter(p=>p.subtenantId===id).length;
    const msg = count>0
      ? 'Delete '+sub.name+' and their '+count+' recorded payment'+(count===1?'':'s')+' (including receipts)? This cannot be undone. To stop rent from coming due instead, edit the subtenant and set a lease end date.'
      : 'Delete '+sub.name+'?';
    if(confirm(msg)){
      DATA.subtenants = getSubtenants().filter(s=>s.id!==id);
      DATA.suitePayments = getSuitePayments().filter(p=>p.subtenantId!==id);
      if(openSubtenantId===id) openSubtenantId = null;
      saveData(); render(); toast('Subtenant deleted');
    }
    return;
  }
  if(action==='record-payment'){ openSuitePaymentModal(id); return; }
  if(action==='view-suite-receipt'){ const p = suitePaymentById(id); if(p) openSuiteReceiptModal(p); return; }
  if(action==='edit-suite-payment'){ const p = suitePaymentById(id); if(p) openSuitePaymentModal(null, p); return; }
  if(action==='delete-suite-payment'){
    if(confirm('Delete this payment and its receipt? This cannot be undone.')){
      DATA.suitePayments = getSuitePayments().filter(p=>p.id!==id);
      saveData(); render(); toast('Payment deleted');
    }
    return;
  }
  if(action==='new-expense'){ openExpenseModal(); return; }
  if(action==='edit-expense'){ openExpenseModal(getExpenses().find(x=>x.id===id)); return; }
  if(action==='exp-prev'){ expenseMonth = shiftMonth(expenseMonth,-1); return render(); }
  if(action==='exp-next'){ expenseMonth = shiftMonth(expenseMonth,1); return render(); }
  if(action==='exp-this'){ expenseMonth = todayStr().slice(0,7); return render(); }
  if(action==='exp-goto'){ expenseMonth = el.dataset.month; return render(); }
  if(action==='delete-expense'){
    const ex = getExpenses().find(x=>x.id===id);
    const msg = ex && ex.type==='monthly'
      ? 'Delete this monthly expense? It will be removed from every month, including past ones. (To keep past months, use the stop button instead.)'
      : 'Delete this expense?';
    if(confirm(msg)){
      DATA.expenses = getExpenses().filter(x=>x.id!==id);
      saveData(); render(); toast('Expense deleted');
    }
    return;
  }
  if(action==='stop-expense'){
    const ex = getExpenses().find(x=>x.id===id);
    if(!ex) return;
    if(expenseMonth <= ex.month){
      if(confirm('This expense starts this month, so stopping it here would remove it entirely. Delete it?')){
        DATA.expenses = getExpenses().filter(x=>x.id!==id);
        saveData(); render(); toast('Expense deleted');
      }
      return;
    }
    if(confirm('Stop "'+ex.name+'" from '+fmtMonth(expenseMonth)+' onward? Earlier months keep it.')){
      ex.endedFrom = expenseMonth;
      saveData(); render(); toast('Recurring expense stopped');
    }
    return;
  }
  if(action==='edit-sale'){ openEditSaleModal(id); return; }
  if(action==='cancel-sale'){
    if(confirm('Cancel this sale? It will be kept for your records but excluded from totals.')){
      const s = DATA.sales.find(s=>s.id===id);
      if(s){ s.status='cancelled'; saveData(); render(); toast('Sale cancelled'); }
    }
    return;
  }
  if(action==='restore-sale'){
    const s = DATA.sales.find(s=>s.id===id);
    if(s){ s.status='completed'; saveData(); render(); toast('Sale restored'); }
    return;
  }
  if(action==='delete-sale'){
    if(confirm('Permanently delete this sale? This cannot be undone.')){
      DATA.sales = DATA.sales.filter(s=>s.id!==id);
      saveData();
      render();
      toast('Sale deleted');
    }
    return;
  }
  if(action==='view-receipt'){
    const sale = DATA.sales.find(s=>s.id===id);
    if(sale) openReceiptModal(sale);
    return;
  }
  if(action==='complete-sale'){
    if(!checkoutState.clientId){ toast('Please select a client'); return; }
    if(!checkoutState.paymentMethodId){ toast('Please select a payment method'); return; }
    const taxRate = DATA.business.taxRate || 0;
    const totals = computeSaleTotals(checkoutState.items, checkoutState.discount, taxRate, checkoutState.tip);
    const pm = paymentMethodById(checkoutState.paymentMethodId);
    const receiptNumber = DATA.nextReceiptNumber || (DATA.sales.length + 1);
    DATA.nextReceiptNumber = receiptNumber + 1;
    const sale = {
      id: uid(),
      receiptNumber,
      clientId: checkoutState.clientId,
      items: checkoutState.items,
      discount: checkoutState.discount,
      subtotal: totals.subtotal, discountAmt: totals.discountAmt, taxRate,
      taxableSubtotal: totals.taxableSubtotal, nonTaxableSubtotal: totals.nonTaxableSubtotal,
      taxAmt: totals.taxAmt, tip: totals.tip, total: totals.total,
      paymentMethodId: checkoutState.paymentMethodId,
      paymentMethodName: pm ? pm.name : '',
      date: checkoutState.date || todayStr(),
      time: new Date().toTimeString().slice(0,5),
      status: 'completed'
    };
    DATA.sales.push(sale);
    if(checkoutState.linkedAppointmentId){
      const a = DATA.appointments.find(a=>a.id===checkoutState.linkedAppointmentId);
      if(a) a.status='completed';
    }
    saveData();
    checkoutState = { clientId:'', items:[], discount:0, linkedAppointmentId:'', paymentMethodId:'', date: todayStr(), tip:0 };
    render();
    openReceiptModal(sale);
    return;
  }
}

function shiftDate(dateStr, days){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

  document.querySelectorAll('#modalRoot [data-close-modal]').forEach(btn=>btn.addEventListener('click', closeModal));
}

          <h2>${escapeHtml(b.name)}</h2>
          ${b.address ? `<div class="center">${escapeHtml(b.address)}</div>` : ''}
          ${(b.phone||b.email) ? `<div class="center">${escapeHtml(b.phone||'')} ${b.phone&&b.email?' &middot; ':''} ${escapeHtml(b.email||'')}</div>` : ''}
          <div class="divider"></div>
          <div>Receipt #${sale.receiptNumber}</div>
          <div>Date: ${fmtDate(sale.date)} ${sale.time}</div>
          <div>Client: ${escapeHtml(clientName(sale.clientId))}</div>
          <div>Payment: ${escapeHtml(sale.paymentMethodName || '-')}</div>
          <div class="divider"></div>
          <table>
            ${sale.items.map(i=>`<tr><td>${escapeHtml(i.name)}${i.exempt?' <span class="small-muted">(exempt)</span>':''}</td><td class="rt">${fmtMoney(i.price)}</td></tr>`).join('')}
          </table>
          <div class="divider"></div>
          <div class="totals-row"><span>Subtotal</span><span>${fmtMoney(sale.subtotal)}</span></div>
          ${sale.discount>0 ? `<div class="totals-row"><span>Discount (${sale.discount}%)</span><span>-${fmtMoney(sale.discountAmt)}</span></div>` : ''}
          <div class="totals-row"><span>Tax (${sale.taxRate}%${(sale.items && sale.items.some(i=>i.exempt)) ? ', some items exempt' : ''})</span><span>${fmtMoney(sale.taxAmt)}</span></div>
          ${sale.tip>0 ? `<div class="totals-row"><span>Tip</span><span>${fmtMoney(sale.tip)}</span></div>` : ''}
          <div class="grand-total"><span>Total</span><span>${fmtMoney(sale.total)}</span></div>
          <div class="divider"></div>
          <div class="center">${escapeHtml(b.receiptNote||'')}</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn secondary" data-close-modal>Close</button>
        <button class="btn" id="printReceiptBtn">Print Receipt</button>
      </div>
    </div>
  `);
  document.getElementById('printReceiptBtn').addEventListener('click', ()=>window.print());
}

/* ---------------- Init ---------------- */
document.getElementById('reconnectBtn').addEventListener('click', reconnectFile);
// App start is driven by onAuthStateChanged above once the user signs in.
</script>
</body>
</html>
